{%- comment -%}
Load page-specific and site-wide custom CSS files.
Theme variables are compiled through assets/styles/styles.scss, not emitted into HTML.
{%- endcomment -%}

{% for css in page.custom-css %}
  <link href="{{ css | relative_url }}" rel="stylesheet">
{% endfor %}

{% for css in site.data.customs.custom-css %}
  <link href="{{ css | relative_url }}" rel="stylesheet">
{% endfor %}
